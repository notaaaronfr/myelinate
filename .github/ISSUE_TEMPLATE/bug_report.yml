name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps, requests or config. Remove secrets and personal data.
      render: shell
  - type: input
    id: version
    attributes:
      label: Myelinate version or commit
    validations: { required: true }
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options: [REST API, Microsoft Agent Framework, OpenClaw, MCP, OpenTelemetry, Generic adapter, Other]
  - type: dropdown
    id: db
    attributes:
      label: Database
      options: [PostgreSQL, SQLite]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
