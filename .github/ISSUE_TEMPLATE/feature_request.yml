name: Feature request
description: Suggest an integration, capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Myelinate doesn't support well today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen? Links to papers or prior art are welcome.
