[project]
name = "myelinate"
version = "0.3.0"
description = "Self-improving skills and memory for any AI agent framework, with governance built in"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "self-improving", "agent-memory", "skills", "mcp", "openclaw", "microsoft-agent-framework",
            "llm", "continual-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "arrondavide", email = "arrondavide@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "opentelemetry-proto>=1.45.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
maf = [
    "agent-framework-core>=1.22.0",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
]

[project.urls]
Homepage = "https://github.com/notaaaronfr/myelinate"
Repository = "https://github.com/notaaaronfr/myelinate"
Issues = "https://github.com/notaaaronfr/myelinate/issues"

[project.scripts]
myelinate = "myelinate.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
docs = [
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
