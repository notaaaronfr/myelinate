# ---------------------------------------------------------------------------------------------
# FOR TRYING MYELINATE OUT ONLY. NOT FOR PRODUCTION.
# Single replica, no backups, no TLS, no HA, password in a plain manifest.
# In production use managed PostgreSQL (RDS / Cloud SQL / Azure Database / AlloyDB / Crunchy, ...)
# with backups, point-in-time recovery and TLS, and put its URL in the myelinate-secrets Secret.
#
# With this file, set MYELINATE_DATABASE_URL in myelinate-secrets to:
#   postgresql+asyncpg://myelinate:dev-only-change-me@postgres-dev:5432/myelinate
# ---------------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dev
  namespace: myelinate
type: Opaque
stringData:
  POSTGRES_PASSWORD: dev-only-change-me
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-dev
  namespace: myelinate
  labels: { app.kubernetes.io/name: postgres-dev }
spec:
  selector: { app.kubernetes.io/name: postgres-dev }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-dev
  namespace: myelinate
  labels: { app.kubernetes.io/name: postgres-dev }
spec:
  serviceName: postgres-dev
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres-dev }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-dev }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999        # the "postgres" user in the official Debian-based image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: myelinate }
            - { name: POSTGRES_USER, value: myelinate }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-dev, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "myelinate", "-d", "myelinate"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "myelinate", "-d", "myelinate"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
