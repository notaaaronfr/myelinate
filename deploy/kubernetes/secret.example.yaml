# EXAMPLE ONLY. Do not commit real values. Prefer creating the Secret out of band, e.g.
#   kubectl -n myelinate create secret generic myelinate-secrets \
#     --from-literal=MYELINATE_BOOTSTRAP_ADMIN_KEY="$(openssl rand -base64 48)" \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=MYELINATE_DATABASE_URL='postgresql+asyncpg://myelinate:<url-encoded-password>@<host>:5432/myelinate'
# or manage it with External Secrets Operator / Sealed Secrets / SOPS.
# This file is intentionally NOT listed in kustomization.yaml, so `kubectl apply -k` never overwrites the real Secret.
apiVersion: v1
kind: Secret
metadata:
  name: myelinate-secrets
  namespace: myelinate
type: Opaque
stringData:
  # Platform-operator key: mint scoped per-tenant API keys with it, then keep it in a vault.
  MYELINATE_BOOTSTRAP_ADMIN_KEY: "REPLACE-with-a-long-random-string"
  # Learning model credentials (not needed when MYELINATE_LLM_PROVIDER=none).
  ANTHROPIC_API_KEY: "REPLACE-sk-ant-..."
  # SQLAlchemy async URL. URL-encode special characters in the password.
  # Managed Postgres usually needs TLS, e.g. append ?ssl=require
  MYELINATE_DATABASE_URL: "postgresql+asyncpg://myelinate:REPLACE@postgres.example.internal:5432/myelinate"
  # Optional:
  # MYELINATE_EMBEDDINGS_API_KEY: "REPLACE"
