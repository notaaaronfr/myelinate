# Gateway: REST API + MCP (/mcp) + OTLP ingest on :8080. Stateless; scale horizontally.
# Learning jobs run in the separate worker Deployment (MYELINATE_WORKER_ENABLED=false here).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myelinate-gateway
  namespace: myelinate
  labels:
    app.kubernetes.io/name: myelinate
    app.kubernetes.io/component: gateway
spec:
  replicas: 2          # the HPA (hpa.yaml) takes over replica count once applied
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: myelinate
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myelinate
        app.kubernetes.io/component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: myelinate
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: ghcr.io/notaaaronfr/myelinate:latest
          imagePullPolicy: IfNotPresent
          args: ["myelinate", "serve", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: myelinate-config }
            - secretRef: { name: myelinate-secrets }
          env:
            - name: MYELINATE_WORKER_ENABLED
              value: "false"
            # Trust X-Forwarded-For from the ingress so per-IP rate limiting sees real client IPs.
            # Only safe when nothing but your ingress controller can reach these pods (see networkpolicy.yaml).
            - name: FORWARDED_ALLOW_IPS
              value: "*"
          readinessProbe:          # checks the database (SELECT 1)
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:           # process only; does not touch the database
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          lifecycle:
            preStop:               # let endpoints/ingress stop routing before uvicorn shuts down
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: myelinate-gateway
  namespace: myelinate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: myelinate
      app.kubernetes.io/component: gateway
